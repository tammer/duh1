[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duh"
version = "0.1.0"
description = "Meeting HUD core: transcript → terms → concise context cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "groq>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
live = [
    "sounddevice>=0.5",
    "numpy>=2.0",
]

[project.scripts]
duh-replay = "duh.cli:main"
duh-live = "duh.live_cli:main"
duh-worker = "duh.worker_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duh"]

[tool.hatch.build.targets.wheel.sources]
"src/duh" = "duh"

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "duh/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
